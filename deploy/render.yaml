services:
  - type: worker
    name: polymarket-bot
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python main.py
    envVars:
      - key: APP_ENV
        value: production

  - type: web
    name: polymarket-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python main.py --api
    envVars:
      - key: APP_ENV
        value: production

databases:
  - name: polymarket-db
    plan: free
    databaseName: polymarket_bot
    user: polymarket
