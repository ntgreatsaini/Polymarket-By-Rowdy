[project]
name = "polymarket-telegram-bot"
version = "1.0.0"
description = "AI-powered Telegram bot for Polymarket signals, whale tracking, and market analysis"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
